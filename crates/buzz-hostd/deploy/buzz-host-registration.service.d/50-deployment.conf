# Opt-in only. Stop the old controller before changing StateDirectory ownership.
[Service]
User=buzz-hostd
Group=buzz-hostd
ExecStart=
ExecStart=/usr/local/libexec/buzz-hostd --state-dir /var/lib/buzz-hostd registration run --deployment --community ${BUZZ_REGISTRY_COMMUNITY} --relay-key ${BUZZ_REGISTRY_RELAY_KEY} --ca-cert /etc/buzz-host-registration/relay-ca.pem
BindPaths=
BindPaths=/var/lib/buzz-host-registration:/var/lib/buzz-hostd
BindReadOnlyPaths=/run/buzz-hostd-activate.sock /etc/buzz-hostd/catalog.json /opt/buzz-runtime
WorkingDirectory=/var/lib/buzz-hostd
ReadWritePaths=
ReadWritePaths=+/var/lib/buzz-hostd
NoExecPaths=
NoExecPaths=+/ +/var/lib/buzz-hostd
RestrictAddressFamilies=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
