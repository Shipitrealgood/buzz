[package]
name = "buzz-hostd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux paired-host control plane"

[dependencies]
anyhow.workspace = true
base64.workspace = true
buzz-core.workspace = true
buzz-ws-client.workspace = true
buzz-sdk.workspace = true
tempfile = "3"
clap = { version = "4", features = ["derive"] }
hex.workspace = true
nostr.workspace = true
rand.workspace = true
reqwest.workspace = true
rusqlite = { version = "0.40", default-features = false, features = ["libsqlite3-sys", "bundled", "fallible_uint"] }
rustix = { version = "1", features = ["process", "fs", "time", "net"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true
