name: Paired hosts systemd rehearsal

on:
  push:
    branches: [verify/paired-hosts-staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    if: github.repository == 'Shipitrealgood/buzz' && github.ref == 'refs/heads/verify/paired-hosts-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DATABASE_URL: postgres://fixture:fixture@127.0.0.1:5432/fixture
      REDIS_URL: redis://127.0.0.1:6379
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    services:
      postgres:
        image: postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_DB: fixture
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U fixture" --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends protobuf-compiler libasound2-dev libssl-dev libclang-dev libudev-dev cmake python3-cryptography nodejs
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: paired-host-systemd
      - name: Build registration-only rehearsal binaries
        run: |
          . ./bin/activate-hermit
          cargo build --locked -p buzz-relay --bin buzz-relay -p buzz-hostd --bin buzz-hostd
          cargo build --locked -p buzz-paired-owner --example registration -p buzz-hostd --example registration_isolation_probe
      - name: Register, recover, restart, revoke and measure actual service isolation
        run: |
          set -o pipefail
          /usr/bin/python3 scripts/paired-hosts/registration-systemd-smoke.py | tee registration-rehearsal.txt
      - name: Pin compatible rehearsal artifacts
        run: |
          mkdir registration-artifacts
          cp target/debug/buzz-hostd target/debug/buzz-relay target/debug/examples/registration registration-artifacts/
          cp crates/buzz-hostd/deploy/buzz-host-registration.service registration-artifacts/
          printf 'source=%s\nprofile=debug-rehearsal; not a deployment release\n' "$GITHUB_SHA" > registration-artifacts/source.txt
          (cd registration-artifacts && sha256sum buzz-hostd buzz-relay registration buzz-host-registration.service source.txt > SHA256SUMS)
          tar -czf registration-linux-rehearsal.tar.gz registration-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registration-linux-rehearsal
          path: |
            registration-linux-rehearsal.tar.gz
            registration-rehearsal.txt
          retention-days: 7
